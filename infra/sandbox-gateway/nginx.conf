server {
  listen 8080;
  server_name _;
  client_max_body_size 80k;

  location = /health {
    proxy_pass http://sandbox:8790/health;
    proxy_set_header Host $host;
  }

  location = /run {
    proxy_pass http://sandbox:8790/run;
    proxy_set_header Host $host;
    proxy_set_header X-Sandbox-Token $http_x_sandbox_token;
    proxy_connect_timeout 1s;
    proxy_read_timeout 4s;
  }

  location / {
    return 404;
  }
}
